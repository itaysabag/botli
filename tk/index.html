<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הצגת מנדט תקציב לקולגיום 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .slide-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 Aspect Ratio */
      margin: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <iframe 
      src="https://docs.google.com/presentation/d/11TCTUzqUoUfBWR2sY1sV2yAZwdKQpbXyDvPby4o_0iw/embed?start=false&loop=false&delayms=3000" 
      allowfullscreen="true" 
      mozallowfullscreen="true" 
      webkitallowfullscreen="true">
    </iframe>
  </div>

</body>
</html>
